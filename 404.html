<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex"> 
    <title>Oops! Undefined Page!</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="body__container">
      <!-- Header -->
      <header class="header normal">
        <div class="header__container">
          <div class="header__container_logo">
            <a href="/#" class="header__logo"
              ><img
                src="asset/img/delacruz.webp"
                alt="logo"
                class="header__img"
            /></a>
          </div>
          <nav class="header__nav">
            <ul class="header__menu">
              <li class="header__item"><a href="/#about">About</a></li>
              <li class="header__item">
                <a href="/#experiences">Experiences</a>
              </li>
              <li class="header__item"><a href="/#projects">Projects</a></li>
              <li class="header__item"><a href="/#contact">Contact</a></li>
            </ul>
          </nav>
        </div>
      </header>
      <!-- Main Content -->
      <section class="normal">
        <div class="error__container">
          <div class="error__title">
            <h1>Oops! Oops! Oops! Undefined Page!</h1>
          </div>
          <div class="error__message">
            <p>
              It seems you are typed a wrong address or you entered a page is
              not found!
            </p>
          </div>
          <div class="error__button">
            <a href="/" class="glassmorphism_button">Go to Home</a>
          </div>
          <div class="error_code">
            <div class="label uppercase">Error Code: 404</div>
          </div>
        </div>
      </section>
    </div>
  </body>
</html>
